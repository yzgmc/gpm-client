name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout gpm-client
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # 国内 CI 拉取 gpm-common 用镜像 git.yzgmc.dpdns.org（github.com 直连在 runner 中通常 OK，但镜像更稳）
          pip install git+https://git.yzgmc.dpdns.org/yzgmc/gpm-common.git
          pip install "PySide6>=6.6.0" "httpx>=0.27.0" "packaging>=23.0"
          pip install nuitka

      - name: Generate version tag
        id: tag
        shell: pwsh
        run: |
          # 每次构建独立 tag：v + UTC 时间戳 + 短 SHA，体现每次改动的过程
          $ts = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmmss")
          $sha = "${{ github.sha }}".Substring(0,7)
          "tag=v$ts-$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=v$ts ($sha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # semver 形式：0.YY.MM.DD+ts（满足 packaging.Version 解析），注入到 APP_VERSION
          $yy = (Get-Date).ToUniversalTime().ToString("yy")
          $mm = (Get-Date).ToUniversalTime().ToString("MM")
          $dd = (Get-Date).ToUniversalTime().ToString("dd")
          $semver = "0.$yy.$mm.$dd+$ts"
          "semver=$semver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build with Nuitka
        shell: pwsh
        env:
          # 注入构建版本号到 app.version.APP_VERSION（CI 唯一标识）
          GPM_APP_VERSION: ${{ steps.tag.outputs.semver }}
        run: |
          # 单 exe 设计：把自升级辅助模块（app._updater_helper）嵌入主 exe。
          # 主进程通过 --gpm-updater argv 启动自身作为升级器，不再需要独立 updater_helper.exe。
          python -m nuitka --onefile --standalone `
            --windows-console-mode=disable `
            --output-filename=gpm-client.exe `
            --output-dir=build `
            --enable-plugin=pyside6 `
            --enable-plugin=anti-bloat `
            --include-package=gpm_common `
            --include-package=app `
            --include-module=app._updater_helper `
            --assume-yes-for-downloads `
            --remove-output `
            run.py

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Path build -Recurse | Select-Object FullName, Length

      - name: Compute SHA-256 of main exe
        id: hash
        shell: pwsh
        run: |
          # 算 SHA-256 写入 Release notes，客户端升级时会校验完整性
          $hash = (Get-FileHash -Path build/gpm-client.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload to Release（每次构建独立 Release）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $title = "${{ steps.tag.outputs.title }}"
          $sha256 = "${{ steps.hash.outputs.sha256 }}"
          $commitMsg = git log -1 --pretty=format:"%s"
          # 单 exe 分发：只上传 gpm-client.exe（自升级模块已嵌入）
          gh release create $tag build/gpm-client.exe --target ${{ github.sha }} `
            --title "GPM 客户端 $title" `
            --notes "Nuitka 打包的 Windows 单文件 exe（PySide6 GUI 客户端，无控制台窗口）。

          对应提交：${{ github.sha }}
          提交说明：$commitMsg

          配置与已安装游戏数据存放在 exe 同级 data/ 目录。
          首次运行稍慢（自解压临时文件）。

          ## 资产校验
          SHA256: $sha256

          ## 自升级说明
          客户端内置「帮助 → 检查更新」（Ctrl+U）会调用本 Release API 自动检测、下载、校验、重启升级。
          自升级辅助逻辑已嵌入主 exe（通过 ``--gpm-updater`` argv 重用自身进程），无需额外 .exe 文件。
          - 主程序: ``gpm-client.exe``（唯一分发文件）"

